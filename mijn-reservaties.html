<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TeckelWeb | Mijn reservaties</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <main class="customer-page">

        <!-- LOGIN -->
        <section id="customer-login" class="customer-login">

            <div class="customer-login-card">

                <p class="section-label">
                    Mijn reservaties
                </p>

                <h1>
                    Bekijk uw reservaties
                </h1>

                <p>
                    Vul uw e-mailadres in. We sturen u een veilige inloglink.
                </p>


                <div class="customer-login-form">

                    <label for="customer-login-email">
                        E-mailadres
                    </label>

                    <input type="email" id="customer-login-email" placeholder="naam@email.be">

                    <button type="button" id="send-login-link" class="customer-login-button">
                        Stuur mij een inloglink
                    </button>

                </div>


                <p id="customer-login-message" class="customer-login-message"></p>

            </div>

        </section>


        <!-- DASHBOARD -->
        <section id="customer-dashboard" class="customer-dashboard" hidden>

            <div class="customer-dashboard-header">

                <div>

                    <p class="section-label">
                        Mijn reservaties
                    </p>

                    <h1>
                        Uw reservaties
                    </h1>

                    <p id="customer-user"></p>

                </div>


                <button type="button" id="customer-logout" class="customer-logout-button">
                    Uitloggen
                </button>

            </div>


            <div id="customer-reservations-list" class="customer-reservations-list">

                <p>
                    Reservaties laden...
                </p>

            </div>

        </section>

    </main>


    <script type="module" src="js/customer.js"></script>

</body>

</html>
